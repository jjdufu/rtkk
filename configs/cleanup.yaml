- name: Play 1 - Cleanup Kubernetes and related components on cluster nodes
  hosts: k8s_cluster
  tasks:
    - name: Stop and disable kubelet service
      systemd:
        name: kubelet
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Stop and disable etcd service
      systemd:
        name: etcd
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Stop and disable containerd service
      systemd:
        name: containerd
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Run kubeadm reset
      shell: "kubeadm reset -f || true"
      ignore_errors: true
    - name: Unmount all kubelet mounts
      shell: 'mount | grep kubelet | cut -d" " -f3 | xargs -r umount || true'
      ignore_errors: true
    - name: Clean up systemd unit files
      shell: "rm -f /etc/systemd/system/kubelet.service /etc/systemd/system/containerd.service /etc/systemd/system/etcd.service && systemctl daemon-reload"
      ignore_errors: true
    - name: Clean up all Kubernetes and etcd files and directories
      shell: "rm -rf /etc/kubernetes /etc/etcd /etc/ssl/etcd /var/lib/etcd /var/lib/kubelet /var/lib/cni /etc/cni /opt/cni /var/log/pods /var/log/containers /etc/containerd /var/run/calico /var/run/cilium /var/run/node-cache /etc/apiserver /etc/sysctl.d/99-kubernetes.conf"
      ignore_errors: true
    - name: Clean up binaries
      shell: "rm -f /usr/local/bin/containerd* /usr/local/bin/runc /usr/local/bin/etcd* /usr/bin/kubeadm /usr/bin/kubelet /usr/bin/kubectl /usr/bin/helm"
      ignore_errors: true
    - name: Reset iptables rules including raw table
      shell: "iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -t raw -F && iptables -X && iptables -t nat -X && iptables -t mangle -X && iptables -t raw -X || true"
      ignore_errors: true
    - name: Remove Cilium and NodeLocalDNS virtual network interfaces
      shell: |
        for iface in cilium_host cilium_net cilium_vxlan nodelocaldns; do
          ip link delete "$iface" 2>/dev/null || true
        done
        for iface in $(ip -o link show | awk -F': ' '{print $2}' | cut -d'@' -f1 | grep -E '^lxc' || true); do
          ip link delete "$iface" 2>/dev/null || true
        done
      ignore_errors: true
    - name: Remove control plane VIP from network interface
      shell: 'ip addr del {{ index (splitList ":" .control_plane_endpoint) 0 }}/32 dev {{ .vip_interface }} 2>/dev/null || true'
      ignore_errors: true
    - name: Remove managed hosts block from /etc/hosts
      shell: "sed -i '/# RTKK HOSTS START/,/# RTKK HOSTS END/d' /etc/hosts || true"
      ignore_errors: true
    - name: Remove temporary images upload tars
      shell: "rm -f /tmp/rtkk_img_*.tar"
      ignore_errors: true
    - name: Remove local fetched PKI directory
      shell: 'rm -rf {{ default "./pki" .pki_dir }} || true'
      delegate_to: localhost
      run_once: true
      ignore_errors: true

- name: Play 2 - Cleanup external Etcd nodes
  hosts: etcd
  tasks:
    - name: Stop and disable etcd service
      systemd:
        name: etcd
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Clean up etcd unit, data, certificates, and binaries
      shell: "rm -f /etc/systemd/system/etcd.service /usr/local/bin/etcd* && rm -rf /etc/etcd /etc/ssl/etcd /var/lib/etcd && systemctl daemon-reload"
      ignore_errors: true
    - name: Remove managed hosts block from /etc/hosts on etcd nodes
      shell: "sed -i '/# RTKK HOSTS START/,/# RTKK HOSTS END/d' /etc/hosts || true"
      ignore_errors: true
