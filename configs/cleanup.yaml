- name: Play 1 - Cleanup Kubernetes and related components on nodes
  hosts: k8s_cluster
  tasks:
    - name: Stop and disable kubelet service
      systemd:
        name: kubelet
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Stop and disable etcd-snap-watcher service
      systemd:
        name: etcd-snap-watcher
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Stop and disable etcd service
      systemd:
        name: etcd
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Stop and disable containerd service
      systemd:
        name: containerd
        state: stopped
        enabled: false
      ignore_errors: true
    - name: Run kubeadm reset
      shell: "kubeadm reset -f || true"
      ignore_errors: true
    - name: Unmount all kubelet mounts
      shell: 'mount | grep kubelet | cut -d" " -f3 | xargs -r umount || true'
      ignore_errors: true
    - name: Clean up systemd unit files
      shell: "rm -f /etc/systemd/system/kubelet.service /etc/systemd/system/containerd.service /etc/systemd/system/etcd.service /etc/systemd/system/etcd-snap-watcher.service && systemctl daemon-reload"
      ignore_errors: true
    - name: Clean up all Kubernetes and etcd files and directories
      shell: "rm -rf /etc/kubernetes /etc/etcd /var/lib/etcd /var/lib/kubelet /var/lib/cni /etc/cni /opt/cni /var/log/pods /var/log/containers /etc/containerd /var/run/calico /var/run/node-cache /etc/apiserver /etc/sysctl.d/99-kubernetes.conf"
      ignore_errors: true
    - name: Clean up binaries
      shell: "rm -f /usr/local/bin/containerd* /usr/local/bin/runc /usr/local/bin/etcd* /usr/bin/kubeadm /usr/bin/kubelet /usr/bin/kubectl /usr/bin/helm"
      ignore_errors: true
    - name: Reset iptables rules
      shell: "iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X || true"
      ignore_errors: true
    - name: Remove temporary images upload tars
      shell: "rm -f /tmp/rtkk_img_*.tar"
      ignore_errors: true
    - name: Remove local fetched PKI directory
      shell: "rm -rf ./pki || true"
      delegate_to: localhost
      run_once: true
      ignore_errors: true
