- name: Download Kubernetes Offline Artifacts
  hosts: localhost
  tasks:
    - name: Create local download directories
      command: "mkdir -p ./downloads/bin ./downloads/tar ./downloads/images ./logs"
    - name: Download kubeadm binary
      http_get_file:
        url: 'https://dl.k8s.io/release/{{ .kube_version }}/bin/linux/{{ default "amd64" .download_arch }}/kubeadm'
        dest: "./downloads/bin/kubeadm"
        mode: "0755"
    - name: Download kubelet binary
      http_get_file:
        url: 'https://dl.k8s.io/release/{{ .kube_version }}/bin/linux/{{ default "amd64" .download_arch }}/kubelet'
        dest: "./downloads/bin/kubelet"
        mode: "0755"
    - name: Download kubectl binary
      http_get_file:
        url: 'https://dl.k8s.io/release/{{ .kube_version }}/bin/linux/{{ default "amd64" .download_arch }}/kubectl'
        dest: "./downloads/bin/kubectl"
        mode: "0755"
    - name: Download containerd archive
      http_get_file:
        url: 'https://github.com/containerd/containerd/releases/download/v{{ .containerd_version }}/containerd-{{ .containerd_version }}-linux-{{ default "amd64" .download_arch }}.tar.gz'
        dest: "./downloads/tar/containerd.tar.gz"
        mode: "0644"
    - name: Download runc binary
      http_get_file:
        url: 'https://github.com/opencontainers/runc/releases/download/{{ .runc_version }}/runc.{{ default "amd64" .download_arch }}'
        dest: "./downloads/bin/runc"
        mode: "0755"
    - name: Download etcd archive
      http_get_file:
        url: 'https://github.com/etcd-io/etcd/releases/download/{{ .etcd_version }}/etcd-{{ .etcd_version }}-linux-{{ default "amd64" .download_arch }}.tar.gz'
        dest: "./downloads/tar/etcd.tar.gz"
        mode: "0644"
    - name: Download CNI plugins archive
      http_get_file:
        url: 'https://github.com/containernetworking/plugins/releases/download/{{ .cni_version }}/cni-plugins-linux-{{ default "amd64" .download_arch }}-{{ .cni_version }}.tgz'
        dest: "./downloads/tar/cni-plugins.tgz"
        mode: "0644"
    - name: Download Helm archive
      http_get_file:
        url: 'https://get.helm.sh/helm-{{ .helm_version }}-linux-{{ default "amd64" .download_arch }}.tar.gz'
        dest: "./downloads/tar/helm.tar.gz"
        mode: "0644"
    - name: Extract Helm binary
      shell: 'tar -zxvf ./downloads/tar/helm.tar.gz --strip-components=1 -C ./downloads/bin linux-{{ default "amd64" .download_arch }}/helm && chmod 0755 ./downloads/bin/kubeadm ./downloads/bin/kubelet ./downloads/bin/kubectl ./downloads/bin/runc ./downloads/bin/helm'
    - name: Pull public images to local tarballs
      command: '{{ default .rtkk_bin .rtkk_exe }} pull-images -i {{ default "configs/inventory.yaml" .inventory_file }} --images-file {{ default "configs/images.yaml" .images_file }} -l logs/pull-images.log'
    - name: Push image tars to private registry
      command: '{{ default .rtkk_bin .rtkk_exe }} push-images -i {{ default "configs/inventory.yaml" .inventory_file }} --images-file {{ default "configs/images.yaml" .images_file }} -l logs/push-images.log'
