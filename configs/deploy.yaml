- name: Play 0 - Clean up previous Kubernetes installation if detected
  hosts: k8s_cluster
  tasks:
    - name: Detect if Kubernetes or Etcd residual files exist
      shell: "if [ -d /etc/kubernetes ] || [ -d /var/lib/etcd ] || [ -d /etc/etcd ]; then echo 'true'; else echo 'false'; fi"
      register: k8s_installed
    - name: Stop and disable kubelet service
      systemd:
        name: kubelet
        state: stopped
        enabled: false
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Stop and disable etcd-snap-watcher service
      systemd:
        name: etcd-snap-watcher
        state: stopped
        enabled: false
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Stop and disable etcd service
      systemd:
        name: etcd
        state: stopped
        enabled: false
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Stop and disable containerd service
      systemd:
        name: containerd
        state: stopped
        enabled: false
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Run kubeadm reset
      shell: "kubeadm reset -f || true"
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Unmount all kubelet mounts
      shell: 'mount | grep kubelet | cut -d" " -f3 | xargs -r umount || true'
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Clean up systemd unit files
      shell: "rm -f /etc/systemd/system/kubelet.service /etc/systemd/system/containerd.service /etc/systemd/system/etcd.service /etc/systemd/system/etcd-snap-watcher.service && systemctl daemon-reload"
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Clean up all Kubernetes and etcd files and directories
      shell: "rm -rf /etc/kubernetes /etc/etcd /var/lib/etcd /var/lib/kubelet /var/lib/cni /etc/cni /opt/cni /var/log/pods /var/log/containers /etc/containerd /var/run/calico /var/run/node-cache /etc/apiserver /etc/sysctl.d/99-kubernetes.conf"
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Clean up binaries
      shell: "rm -f /usr/local/bin/containerd* /usr/local/bin/runc /usr/local/bin/etcd* /usr/bin/kubeadm /usr/bin/kubelet /usr/bin/kubectl /usr/bin/helm"
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Reset iptables rules
      shell: "iptables -F && iptables -t nat -F && iptables -t mangle -F && iptables -X || true"
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
    - name: Remove temporary images upload tars
      shell: "rm -f /tmp/rtkk_img_*.tar"
      when: 'eq .k8s_installed.stdout "true"'
      ignore_errors: true
- name: Play 1 - Prepare Node System Configurations
  hosts: k8s_cluster
  tasks:
    - name: Disable swap
      shell: "swapoff -a && sed -ri '/^[^#]*swap/s/^/#/' /etc/fstab"
    - name: Load bridge netfilter module
      modprobe:
        name: br_netfilter
        state: present
    - name: Load overlay module
      modprobe:
        name: overlay
        state: present
    - name: Load conntrack module
      modprobe:
        name: nf_conntrack
        state: present
    - name: Enable IPv4 packet forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: "/etc/sysctl.d/99-kubernetes.conf"
    - name: Enable bridge netfilter iptables call
      sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "1"
        sysctl_file: "/etc/sysctl.d/99-kubernetes.conf"
    - name: Ensure upstream DNS is configured in resolv.conf
      shell: "grep -q 'nameserver' /etc/resolv.conf || echo 'nameserver {{ .dns_upstream }}' > /etc/resolv.conf"
- name: Play 2 - Install Containerd Runtime
  hosts: k8s_cluster
  tasks:
    - name: Copy containerd archive
      copy:
        src: "./downloads/tar/containerd.tar.gz"
        dest: "/tmp/containerd.tar.gz"
    - name: Extract containerd binary package
      shell: "tar -C /usr/local -xzf /tmp/containerd.tar.gz && rm -f /tmp/containerd.tar.gz"
    - name: Copy runc binary
      copy:
        src: "./downloads/bin/runc"
        dest: "/usr/local/bin/runc"
        mode: 0755
    - name: Create CNI directories
      command: "mkdir -p /opt/cni/bin /etc/cni/net.d /etc/containerd"
    - name: Copy CNI plugins archive
      copy:
        src: "./downloads/tar/cni-plugins.tgz"
        dest: "/tmp/cni-plugins.tgz"
    - name: Extract CNI plugins package
      shell: "tar -C /opt/cni/bin -xzf /tmp/cni-plugins.tgz && rm -f /tmp/cni-plugins.tgz"
    - name: Generate containerd configuration
      template:
        src: "./tmpl/templates/containerd-config.toml.gtmpl"
        dest: "/etc/containerd/config.toml"
        mode: 0644
    - name: Create certs.d directories for public registries
      command: "mkdir -p /etc/containerd/certs.d/{{ .item }}"
      with_items: "{{ .public_registries }}"
    - name: Create certs.d directory for private registry
      command: "mkdir -p /etc/containerd/certs.d/{{ index (splitList \"/\" .registry.url) 0 }}"
    - name: Write hosts.toml for public registries HTTP redirect
      copy:
        content: |
          server = "https://{{ .item }}"
          [host."http://{{ .item }}"]
            capabilities = ["pull", "resolve"]
        dest: "/etc/containerd/certs.d/{{ .item }}/hosts.toml"
      with_items: "{{ .public_registries }}"
    - name: Write hosts.toml for local registry IP (HTTP + Basic auth)
      copy:
        content: |
          server = "http://{{ index (splitList "/" .registry.url) 0 }}"
          [host."http://{{ index (splitList "/" .registry.url) 0 }}"]
            capabilities = ["pull", "resolve"]
            skip_verify = true
            [host."http://{{ index (splitList "/" .registry.url) 0 }}".header]
              authorization = "Basic {{ .registry.auth_basic }}"
        dest: "/etc/containerd/certs.d/{{ index (splitList \"/\" .registry.url) 0 }}/hosts.toml"
    - name: Setup containerd systemd service
      copy:
        content: |
          [Unit]
          Description=containerd container runtime
          Documentation=https://containerd.io
          After=network.target local-fs.target
          [Service]
          ExecStartPre=-/sbin/modprobe overlay
          ExecStart=/usr/local/bin/containerd
          Type=notify
          Delegate=yes
          KillMode=process
          Restart=always
          RestartSec=5
          LimitNOFILE=1048576
          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/containerd.service"
        mode: 0644
    - name: Enable and start containerd service
      systemd:
        name: containerd
        enabled: true
        state: restarted
        daemon_reload: true
    - name: Copy K8s binaries to all nodes
      copy:
        src: "./downloads/bin/{{ .item }}"
        dest: "/usr/bin/{{ .item }}"
        mode: 0755
      with_items:
        - kubeadm
        - kubelet
        - kubectl
        - helm
    - name: Reset kubeadm on all nodes
      shell: "kubeadm reset -f || true"
- name: Play 3 - Deploy High Availability Etcd Cluster
  hosts: etcd
  tasks:
    - name: Create etcd directories
      command: "mkdir -p /etc/etcd/pki /var/lib/etcd /var/lib/etcd/member/snap /var/lib/etcd/member/wal"
    - name: Copy etcd archive
      copy:
        src: "./downloads/tar/etcd.tar.gz"
        dest: "/tmp/etcd.tar.gz"
    - name: Extract etcd binaries
      shell: "mkdir -p /tmp/etcd-bin && tar -C /tmp/etcd-bin --strip-components=1 -xzf /tmp/etcd.tar.gz && mv /tmp/etcd-bin/etcd* /usr/local/bin/ && rm -rf /tmp/etcd-bin && rm -f /tmp/etcd.tar.gz"
    - name: Generate etcd CA key and certificate
      gen_cert:
        cn: "etcd-ca"
        out_key: "/etc/etcd/pki/ca.key"
        out_cert: "/etc/etcd/pki/ca.pem"
        is_ca: true
      run_once: true
    - name: Copy etcd CA key and certificate to all nodes
      copy:
        src: "./pki/ca.pem"
        dest: "/etc/etcd/pki/ca.pem"
        mode: 0644
    - name: Copy etcd CA key to all nodes
      copy:
        src: "./pki/ca.key"
        dest: "/etc/etcd/pki/ca.key"
        mode: 0600
    - name: Generate etcd server certificate
      gen_cert:
        cn: "{{ .inventory_hostname }}"
        out_key: "/etc/etcd/pki/etcd-key.pem"
        out_cert: "/etc/etcd/pki/etcd.pem"
        root_key: "/etc/etcd/pki/ca.key"
        root_cert: "/etc/etcd/pki/ca.pem"
        sans:
          - "127.0.0.1"
          - "localhost"
          - "{{ .ip }}"
    - name: Generate etcd peer certificate
      gen_cert:
        cn: "{{ .inventory_hostname }}"
        out_key: "/etc/etcd/pki/peer-key.pem"
        out_cert: "/etc/etcd/pki/peer.pem"
        root_key: "/etc/etcd/pki/ca.key"
        root_cert: "/etc/etcd/pki/ca.pem"
        sans:
          - "{{ .ip }}"
    - name: Generate etcd client certificate (for API server)
      gen_cert:
        cn: "etcd-client"
        out_key: "/etc/etcd/pki/etcd-client-key.pem"
        out_cert: "/etc/etcd/pki/etcd-client.pem"
        root_key: "/etc/etcd/pki/ca.key"
        root_cert: "/etc/etcd/pki/ca.pem"
    - name: Render etcd systemd unit service file
      template:
        src: "./tmpl/templates/etcd.service.gtmpl"
        dest: "/etc/systemd/system/etcd.service"
        mode: 0644
    - name: Enable and start etcd cluster service
      systemd:
        name: etcd
        enabled: true
        state: started
        daemon_reload: true
    - name: Create etcd snapshot directory watcher service
      copy:
        content: |
          [Unit]
          Description=Etcd Snapshot Directory Watcher
          After=etcd.service
          [Service]
          Type=simple
          ExecStart=/bin/sh -c 'while true; do mkdir -p /var/lib/etcd/member/snap; sleep 1; done'
          Restart=always
          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/etcd-snap-watcher.service"
        mode: 0644
    - name: Enable and start etcd snapshot directory watcher service
      systemd:
        name: etcd-snap-watcher
        enabled: true
        state: started
        daemon_reload: true
    - name: Wait for etcd cluster to be healthy
      shell: "etcdctl --cacert=/etc/etcd/pki/ca.pem --cert=/etc/etcd/pki/etcd.pem --key=/etc/etcd/pki/etcd-key.pem --endpoints={{ .etcd_endpoints_str }} endpoint health"
      retries: 30
      delay: 5
- name: Play 4 - Deploy Kubernetes Control Plane
  hosts: kube_control_plane
  tasks:
    - name: Create kubelet systemd service file
      copy:
        content: |
          [Unit]
          Description=kubelet: The Kubernetes Node Agent
          Documentation=https://kubernetes.io/docs/
          After=containerd.service
          Requires=containerd.service
          [Service]
          ExecStart=/usr/bin/kubelet --config=/var/lib/kubelet/config.yaml --bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
          EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
          EnvironmentFile=-/etc/default/kubelet
          Restart=always
          StartLimitInterval=0
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/kubelet.service"
        mode: 0644
    - name: Enable kubelet service
      systemd:
        name: kubelet
        enabled: true
        daemon_reload: true
    - name: Create K8s config & certificate directories
      command: "mkdir -p /etc/kubernetes/pki /etc/kubernetes/manifests /etc/apiserver/pki"
    - name: Create kube-vip static pod manifest
      copy:
        content: |
          apiVersion: v1
          kind: Pod
          metadata:
            name: kube-vip
            namespace: kube-system
          spec:
            containers:
            - args:
              - manager
              env:
              - name: vip_arp
                value: "true"
              - name: port
                value: '{{ index (splitList ":" .control_plane_endpoint) 1 }}'
              - name: vip_interface
                value: "{{ .vip_interface }}"
              - name: vip_cidr
                value: "32"
              - name: cp_enable
                value: "true"
              - name: cp_namespace
                value: kube-system
              - name: vip_ddns
                value: "false"
              - name: svc_enable
                value: "false"
              - name: vip_leaderelection
                value: "true"
              - name: vip_leaseduration
                value: "5"
              - name: vip_renewdeadline
                value: "3"
              - name: vip_retryperiod
                value: "1"
              - name: lb_enable
                value: "false"
              - name: lb_port
                value: '{{ index (splitList ":" .control_plane_endpoint) 1 }}'
              - name: address
                value: '{{ index (splitList ":" .control_plane_endpoint) 0 }}'
              image: "{{ .registry.url }}/kube-vip:{{ .kube_vip_version }}"
              imagePullPolicy: IfNotPresent
              name: kube-vip
              resources: {}
              securityContext:
                capabilities:
                  add:
                  - NET_ADMIN
                  - NET_RAW
                  - SYS_TIME
              volumeMounts:
              - mountPath: /etc/kubernetes/admin.conf
                name: kubeconfig
            hostAliases:
            - hostnames:
              - kubernetes
              ip: 127.0.0.1
            hostNetwork: true
            volumes:
            - hostPath:
                path: /etc/kubernetes/admin.conf
              name: kubeconfig
        dest: "/etc/kubernetes/manifests/kube-vip.yaml"
        mode: 0644
    - name: Share etcd client certificates to apiserver PKI directory
      shell: "mkdir -p /etc/apiserver/pki && cp /etc/etcd/pki/etcd-client* /etc/apiserver/pki/ && cp /etc/etcd/pki/ca.pem /etc/apiserver/pki/etcd-ca.pem"
    - name: Render kubeadm configuration file
      template:
        src: "./tmpl/templates/kubeadm-config.yaml.gtmpl"
        dest: "/etc/kubernetes/kubeadm-config.yaml"
        mode: 0644
    - name: Initialize Kubernetes Control Plane Node (First Master)
      shell: "kubeadm init --config /etc/kubernetes/kubeadm-config.yaml --upload-certs || (echo kubeadm_init_failed_retrying_phases && sleep 15 && kubeadm init phase mark-control-plane --config /etc/kubernetes/kubeadm-config.yaml && kubeadm init phase bootstrap-token --config /etc/kubernetes/kubeadm-config.yaml && kubeadm init phase addon all --config /etc/kubernetes/kubeadm-config.yaml)"
      run_once: true
      register: init_output
    - name: Setup local root kubeconfig path
      shell: "mkdir -p $HOME/.kube && cp -f /etc/kubernetes/admin.conf $HOME/.kube/config"
      run_once: true
    - name: Extract join command parameters
      shell: "kubeadm token create --print-join-command"
      run_once: true
      register: join_cmd
    - name: Fetch K8s CA certificate
      fetch:
        src: "/etc/kubernetes/pki/ca.crt"
        dest: "{{ .pki_dir }}/kubernetes/ca.crt"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Fetch K8s CA key
      fetch:
        src: "/etc/kubernetes/pki/ca.key"
        dest: "{{ .pki_dir }}/kubernetes/ca.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Fetch K8s SA key
      fetch:
        src: "/etc/kubernetes/pki/sa.key"
        dest: "{{ .pki_dir }}/sa.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Fetch K8s SA public key
      fetch:
        src: "/etc/kubernetes/pki/sa.pub"
        dest: "{{ .pki_dir }}/sa.pub"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Fetch K8s front-proxy CA certificate
      fetch:
        src: "/etc/kubernetes/pki/front-proxy-ca.crt"
        dest: "{{ .pki_dir }}/front-proxy-ca.crt"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Fetch K8s front-proxy CA key
      fetch:
        src: "/etc/kubernetes/pki/front-proxy-ca.key"
        dest: "{{ .pki_dir }}/front-proxy-ca.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Copy K8s CA certificate to joining masters
      copy:
        src: "{{ .pki_dir }}/kubernetes/ca.crt"
        dest: "/etc/kubernetes/pki/ca.crt"
        mode: 0644
      when: 'ne .inventory_hostname .first_control_plane'
    - name: Copy K8s CA key to joining masters
      copy:
        src: "{{ .pki_dir }}/kubernetes/ca.key"
        dest: "/etc/kubernetes/pki/ca.key"
        mode: 0600
      when: 'ne .inventory_hostname .first_control_plane'
    - name: Copy K8s SA key to joining masters
      copy:
        src: "{{ .pki_dir }}/sa.key"
        dest: "/etc/kubernetes/pki/sa.key"
        mode: 0600
      when: 'ne .inventory_hostname .first_control_plane'
    - name: Copy K8s SA public key to joining masters
      copy:
        src: "{{ .pki_dir }}/sa.pub"
        dest: "/etc/kubernetes/pki/sa.pub"
        mode: 0644
      when: 'ne .inventory_hostname .first_control_plane'
    - name: Copy K8s front-proxy CA certificate to joining masters
      copy:
        src: "{{ .pki_dir }}/front-proxy-ca.crt"
        dest: "/etc/kubernetes/pki/front-proxy-ca.crt"
        mode: 0644
      when: 'ne .inventory_hostname .first_control_plane'
    - name: Copy K8s front-proxy CA key to joining masters
      copy:
        src: "{{ .pki_dir }}/front-proxy-ca.key"
        dest: "/etc/kubernetes/pki/front-proxy-ca.key"
        mode: 0600
      when: 'ne .inventory_hostname .first_control_plane'
    - name: Join additional control plane master nodes
      shell: "{{ index .hostvars .first_control_plane \"join_cmd\" \"stdout\" }} --control-plane --cri-socket=unix:///var/run/containerd/containerd.sock"
      when: 'ne .inventory_hostname .first_control_plane'
- name: Play 5 - Join Kubernetes Worker Nodes
  hosts: kube_node
  tasks:
    - name: Create kubelet systemd service file
      copy:
        content: |
          [Unit]
          Description=kubelet: The Kubernetes Node Agent
          Documentation=https://kubernetes.io/docs/
          After=containerd.service
          Requires=containerd.service
          [Service]
          ExecStart=/usr/bin/kubelet --config=/var/lib/kubelet/config.yaml --bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
          EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
          EnvironmentFile=-/etc/default/kubelet
          Restart=always
          StartLimitInterval=0
          RestartSec=10
          [Install]
          WantedBy=multi-user.target
        dest: "/etc/systemd/system/kubelet.service"
        mode: 0644
    - name: Enable kubelet service
      systemd:
        name: kubelet
        enabled: true
        daemon_reload: true
    - name: Join worker node to cluster
      shell: "{{ index .hostvars .first_control_plane \"join_cmd\" \"stdout\" }} --cri-socket=unix:///var/run/containerd/containerd.sock"
- name: Play 6 - Deploy Kubernetes Addons (Network, Storage, DNS Cache)
  hosts: kube_control_plane
  tasks:
    - name: Create addons directory
      shell: "mkdir -p /etc/kubernetes/addons"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Render Cilium manifest
      template:
        src: tmpl/templates/cilium.yaml.gtmpl
        dest: /etc/kubernetes/addons/cilium.yaml
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Render OpenEBS LocalPV manifest
      template:
        src: tmpl/templates/local-volume.yaml.gtmpl
        dest: /etc/kubernetes/addons/local-volume.yaml
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Render NodeLocalDNS manifest
      template:
        src: tmpl/templates/nodelocaldns.yaml.gtmpl
        dest: /etc/kubernetes/addons/nodelocaldns.yaml
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Apply Cilium manifest
      shell: "kubectl apply -f /etc/kubernetes/addons/cilium.yaml"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Apply OpenEBS LocalPV manifest
      shell: "kubectl apply -f /etc/kubernetes/addons/local-volume.yaml"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Apply NodeLocalDNS manifest
      shell: "kubectl apply -f /etc/kubernetes/addons/nodelocaldns.yaml"
      when: 'eq .inventory_hostname .first_control_plane'
- name: Play 7 - Backup Control Plane and Global Configurations
  hosts: kube_control_plane
  tasks:
    - name: Backup global K8s CA certificate
      fetch:
        src: "/etc/kubernetes/pki/ca.crt"
        dest: "./rtkk_bak/global_pki/kubernetes/ca.crt"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global K8s CA key
      fetch:
        src: "/etc/kubernetes/pki/ca.key"
        dest: "./rtkk_bak/global_pki/kubernetes/ca.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global K8s SA key
      fetch:
        src: "/etc/kubernetes/pki/sa.key"
        dest: "./rtkk_bak/global_pki/kubernetes/sa.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global K8s SA public key
      fetch:
        src: "/etc/kubernetes/pki/sa.pub"
        dest: "./rtkk_bak/global_pki/kubernetes/sa.pub"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global front-proxy CA certificate
      fetch:
        src: "/etc/kubernetes/pki/front-proxy-ca.crt"
        dest: "./rtkk_bak/global_pki/kubernetes/front-proxy-ca.crt"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global front-proxy CA key
      fetch:
        src: "/etc/kubernetes/pki/front-proxy-ca.key"
        dest: "./rtkk_bak/global_pki/kubernetes/front-proxy-ca.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global etcd CA certificate
      fetch:
        src: "/etc/etcd/pki/ca.pem"
        dest: "./rtkk_bak/global_pki/etcd/ca.pem"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup global etcd CA key
      fetch:
        src: "/etc/etcd/pki/ca.key"
        dest: "./rtkk_bak/global_pki/etcd/ca.key"
      when: 'eq .inventory_hostname .first_control_plane'
    - name: Backup apiserver server certificate
      fetch:
        src: "/etc/kubernetes/pki/apiserver.crt"
        dest: "./rtkk_bak/nodes/{{ .ip }}/pki/apiserver.crt"
    - name: Backup apiserver server key
      fetch:
        src: "/etc/kubernetes/pki/apiserver.key"
        dest: "./rtkk_bak/nodes/{{ .ip }}/pki/apiserver.key"
    - name: Backup apiserver kubelet client certificate
      fetch:
        src: "/etc/kubernetes/pki/apiserver-kubelet-client.crt"
        dest: "./rtkk_bak/nodes/{{ .ip }}/pki/apiserver-kubelet-client.crt"
    - name: Backup apiserver kubelet client key
      fetch:
        src: "/etc/kubernetes/pki/apiserver-kubelet-client.key"
        dest: "./rtkk_bak/nodes/{{ .ip }}/pki/apiserver-kubelet-client.key"
    - name: Backup etcd server certificate
      fetch:
        src: "/etc/etcd/pki/etcd.pem"
