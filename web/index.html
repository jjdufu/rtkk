<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>RTKK 控制台</title>
    <script>
      (function () {
        try {
          var raw = window.localStorage.getItem("rtkk.theme.v1");
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && (parsed.mode === "dark" || parsed.mode === "light")) {
            if (parsed.mode === "dark") {
              document.documentElement.setAttribute("data-theme", "dark");
            } else {
              document.documentElement.removeAttribute("data-theme");
            }
          }
          if (parsed && typeof parsed.radius === "string") {
            document.documentElement.style.setProperty("--radius-md", parsed.radius);
          }
        } catch (_err) {
          /* ignore storage failure in restricted contexts */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
